# Replace forum.example.org, obtain HTTPS certificate, then enable.
# Never expose /opt/forummm as a static document root.
limit_req_zone $binary_remote_addr zone=forum_api:10m rate=5r/s;
server {
    listen 80;
    server_name forum.example.org;
    client_max_body_size 4k;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        limit_req zone=forum_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
